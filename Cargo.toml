[package]
name = "btsnoop-extcap"
version = "0.1.7"
edition = "2024"
authors = ["Maurice Lam <mauriceprograms@gmail.com>"]
description = "View Android's btsnoop logs (Bluetooth HCI logs) in Wireshark"
documentation = "https://docs.rs/btsnoop-extcap"
readme = "README.md"
repository = "https://github.com/mauricelam/btsnoop-extcap/"
license = "MIT"
keywords = ["bluetooth", "btsnoop", "extcap", "wireshark"]
categories = ["parser-implementations"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
r-extcap = { version = "0.2.5" }
btsnoop = { version = "0.2.1" }
pcap-file = "2.0.0"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
nom-derive = "0.10.1"
nom = "7.1.3"
regex = "1.12.2"
tokio = { version = "1.48.0", features = ["full"] }
log = "0.4.29"
flexi_logger = "0.31.7"
thiserror = "2.0.17"
lazy_static = "1.5.0"
which = "8.0.0"
dirs = "6.0.0"

[dev-dependencies]
assert_cmd = "2.1.1"
indoc = "2.0.7"
predicates = "3.1.3"
